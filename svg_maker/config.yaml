name: "SVG Maker"
version: "1.3.0"
slug: svg_maker
description: "Turn photos into scalable SVG vector files right from Home Assistant"
url: "https://github.com/"
arch: [aarch64, amd64, armv7]
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:vector-curve
panel_title: SVG Maker
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false
  - type: ssl
    read_only: false
  - type: addons
    read_only: false
  - type: addon_config
    read_only: false
  - type: all_addon_configs
    read_only: false
options:
  log_level: info
  output_path: /share/svg_maker
  temp_path: /homeassistant/www/svg_maker/temp_icons
  auto_delete_temp: false
  auto_delete_after_days: 7
  filename_style: original_timestamp
  on_name_conflict: rename
  default_mode: color
  default_detail: 5
  path_style: spline
  max_image_dimension: 1600
  max_upload_mb: 25
  crop_editor: true
  auto_crop: true
  crop_shape: circle
  crop_padding: 15
  output_size: 512
  auto_enhance: true
schema:
  log_level: list(debug|info|warning|error)
  output_path: str
  temp_path: str
  auto_delete_temp: bool
  auto_delete_after_days: int(1,365)
  filename_style: list(original|timestamp|original_timestamp)
  on_name_conflict: list(rename|overwrite)
  default_mode: list(color|bw)
  default_detail: int(1,10)
  path_style: list(spline|polygon|none)
  max_image_dimension: int(400,4000)
  max_upload_mb: int(1,100)
  crop_editor: bool
  auto_crop: bool
  crop_shape: list(circle|rounded|square|none)
  crop_padding: int(0,60)
  output_size: int(128,2048)
  auto_enhance: bool
